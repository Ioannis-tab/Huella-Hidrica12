<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Monitoreo Hídrico Textil</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white p-4">

<div class="container">

<h2 class="text-info border-bottom pb-2">💧 Monitoreo de Huella Hídrica - Planta Tintorería</h2>

<div class="row mt-4">

<div class="col-md-5">

<div class="card bg-secondary text-white p-3">

<select id="tipoFibra" class="form-select mb-2">

<option value="algodon">Algodón</option>

<option value="poliester">Poliéster</option>

</select>

<input type="number" id="kilosTela" class="form-control mb-3" placeholder="Kilogramos procesados">

<button id="btnCalcular" class="btn btn-info w-100 fw-bold">Calcular Impacto</button>

</div>

<div class="alert alert-warning mt-3 fs-5">

Agua Total Consumida: <br><strong id="aguaTotal">0</strong> Litros

</div>

</div>

<div class="col-md-7">
<ul id="historialLotes" class="list-group list-group-flush rounded">
<!-- JS inyectará los lotes evaluados -->
</ul>
</div>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
